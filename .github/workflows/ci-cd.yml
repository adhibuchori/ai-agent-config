name: CI/CD Pipeline

on:
  push:
    branches: [prod]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Separate job so the deploy fires immediately: Dokploy builds from git source
  # and never pulls the ghcr image built below.
  trigger-deploy:
    name: Trigger Dokploy Deploy
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Must stay above the retry window in trigger-deploy.sh (currently 9 min).
    timeout-minutes: 12
    # Bot commits ([skip ci]) must not redeploy — they change nothing in the image.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: prod
          sparse-checkout: .github/scripts

      - name: Trigger Dokploy Deploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: .github/scripts/trigger-deploy.sh "${{ github.ref }}"

  build-and-deploy:
    name: Build & Deploy
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@a5256a73e30f09e37e3eceb8ca36043d17621d24 # v2.1.0
        with:
          cache-key: Dockerfile

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      # No cache-from/cache-to: Blacksmith's sticky-disk builder caches layers automatically.
      - name: Build & Push Docker Image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Deploys come from the trigger-deploy job above, never from a repo webhook:
      # webhooks fire on bot commits too and cannot be filtered on GitHub's side.
